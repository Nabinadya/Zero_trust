$kind: http-request
url: "{{gatewayUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshTokenMhs1}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC15 - Refresh token valid: status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("TC15 - New access token returned", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("accessToken").that.is.a("string");
          pm.collectionVariables.set("tokenMhs1", json.accessToken);
      });
    language: text/javascript
settings: {}
order: 7000
