$kind: http-request
description: mhs1 tries to access admin audit logs. Must be denied.
url: "{{gatewayUrl}}/admin/audit-logs"
method: GET
headers:
  Authorization: Bearer {{tokenMhs1}}
  X-Device-ID: DEVICE-MHS-001
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC19 - Mahasiswa melihat audit log ditolak: status 401 or 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403]);
      });
    language: text/javascript
settings: {}
order: 2000
